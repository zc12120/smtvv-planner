[program:smtvv-compute]
command=/usr/bin/nice -n 5 /usr/bin/python3 /opt/smtvv-compute/current/compute_worker.py --config /etc/smtvv-compute.json --slot %(process_num)s
process_name=slot-%(process_num)02d
numprocs=2
directory=/opt/smtvv-compute/current
user=smtvv-compute
environment=PYTHONDONTWRITEBYTECODE="1",PYTHONUNBUFFERED="1",SMTVV_COMPUTE_MODE="worker"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/smtvv-compute/slot-%(process_num)s.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
