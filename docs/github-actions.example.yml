name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-auth.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Website browser check
        run: |
          python server.py --port 8766 > /tmp/smtvv-test.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=2)
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Application did not become ready')
          PY
          SMTVV_URL=http://127.0.0.1:8766 npm run test:public
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy authentication stack
        run: python3 scripts/deploy.py https://planner.example.com --behind-proxy
      - name: Validate authentication and HTTPS configuration
        run: |
          docker compose exec -T authelia authelia config validate --config /config/configuration.yml
          docker compose -f compose.yaml -f compose.https.yaml config --quiet
          docker compose -f compose.yaml -f compose.https.yaml run --rm --no-deps --entrypoint caddy https validate --config /etc/caddy/Caddyfile --adapter caddyfile
          python3 - <<'PY'
          import urllib.request, urllib.error
          request = urllib.request.Request('http://127.0.0.1:8088/api/catalog', headers={'Host':'planner.example.com'})
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as error:
              assert error.code == 401, error.code
          else:
              raise AssertionError('Anonymous API unexpectedly allowed')
          PY
      - name: Repeated deployment preserves private state
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          def snapshot():
              return {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in pathlib.Path('runtime').rglob('*') if p.is_file()}
          before = snapshot()
          subprocess.run(['python3', 'scripts/deploy.py', 'https://planner.example.com', '--behind-proxy'], check=True)
          assert before == snapshot(), 'Private configuration changed during repeated deployment'
          PY
      - name: Cleanup ephemeral test deployment
        if: always()
        run: docker compose -f compose.yaml -f compose.https.yaml down -v --remove-orphans
