<script>
// Keep stylesheet recovery available even if an external script cannot load.
window.addEventListener('error',event=>{
  const link=event.target;
  if(!(link instanceof HTMLLinkElement)||!link.relList.contains('stylesheet'))return;
  const attempt=Number(link.dataset.stylesheetRetries||0);
  if(attempt>=2)return;
  link.dataset.stylesheetRetries=String(attempt+1);
  const url=new URL(link.href);url.searchParams.set('cssRetry',String(attempt+1));
  setTimeout(()=>{if(link.isConnected)link.href=url.href;},200*(attempt+1));
},true);
</script>

<script>
// Keep the loader inline so a failed first script request still has a recovery path.
window.currentPage=null;
(async()=>{
  const sources=["/auth/theme/i18n.js?v=route-ledger-20260917-1","assets/icons.js?v=performance-20260916-1","site.js?v=innate-search-20260918-1","skills-ui.js?v=worlds-20260914-1","entry.js?v=density-20260915-1","ui.js?v=route-actions-20260917-1"];
  for(const source of sources){
    for(let attempt=0;attempt<3;attempt++){
      try{
        await new Promise((resolve,reject)=>{
          const script=document.createElement('script');
          const timer=setTimeout(()=>reject(Error('timeout')),12000);
          script.src=source+(attempt?(source.includes('?')?'&':'?')+'loadRetry='+attempt:'');
          script.async=false;
          script.onload=()=>{clearTimeout(timer);resolve();};
          script.onerror=()=>{clearTimeout(timer);script.remove();reject(Error('network'));};
          document.body.append(script);
        });
        if (source.includes("/i18n.js")) await SmtvvI18n.ready;
        break;
      }catch(error){
        // A timed-out script could still arrive later; reload the page instead
        // of inserting another copy that might execute the same code twice.
        if(error.message==='timeout'||attempt===2)throw error;
        await new Promise(resolve=>setTimeout(resolve,400*(attempt+1)));
      }
    }
  }
})().catch(()=>{
  document.body.dataset.catalogState='error';
  document.querySelectorAll('[aria-busy="true"]').forEach(element=>element.setAttribute('aria-busy','false'));
  const status=document.getElementById('status');
  if(status)status.textContent='页面资源未就绪';
  const box=document.getElementById('error')||document.getElementById('entry-content');
  if(box){box.textContent='页面资源暂时无法加载，请重新加载。';box.setAttribute('role','alert');}
  let button=document.getElementById('retry-data');
  if(!button){button=document.createElement('button');button.id='retry-page';button.type='button';button.className='secondary';button.textContent='重新加载页面';(box||document.body).append(button);}
  button.hidden=false;button.onclick=()=>location.reload();
});
</script>
